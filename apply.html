<!DOCTYPE html>
<html lang="en" class="bg-black text-white">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exclusive Partnership Request | Markel Media</title>
  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-black via-zinc-950 to-black relative overflow-hidden">

  <!-- Background shimmer -->
  <div class="absolute inset-0 bg-gradient-radial from-yellow-600/10 via-transparent to-transparent animate-pulse"></div>

  <div x-data="{ step: 'gate', code: '', q: 0, answers: {}, submitted: false }"
       class="w-full max-w-2xl p-10 bg-zinc-950/90 backdrop-blur-xl rounded-3xl shadow-2xl border border-yellow-500/30 relative z-10">

    <!-- Invite Gate -->
    <template x-if="step === 'gate'">
      <div class="text-center space-y-6">
        <h1 class="text-3xl font-serif text-yellow-500 tracking-wide">Private Access</h1>
        <p class="text-zinc-400">This request form is available by invitation only. Please provide your access credentials.</p>

        <input x-model="code"
               type="password"
               placeholder="Enter Invite Code"
               class="w-full px-5 py-4 bg-black border border-zinc-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-yellow-500 text-center text-lg" />

        <button @click="code === 'MARKEL2025' ? step = 'form' : alert('Invalid Access Code')"
                class="w-full py-4 mt-6 bg-gradient-to-r from-yellow-600 to-yellow-500 text-black font-bold rounded-xl shadow-lg hover:from-yellow-500 hover:to-yellow-400 transition">
          Unlock Partnership Request
        </button>
      </div>
    </template>

    <!-- Sequential Questions -->
    <template x-if="step === 'form' && !submitted">
      <form @submit.prevent="submitted = true" class="space-y-8">
        <h2 class="text-2xl font-serif text-center text-yellow-500 mb-4">Partnership Request</h2>

        <!-- Question Container -->
        <div class="text-center space-y-6 animate-fadeIn">
          <template x-if="q === 0">
            <div>
              <p class="mb-3 text-lg text-zinc-300">1. What does your brand or development currently offer to the market?</p>
              <textarea x-model="answers.q1" required rows="4"
                        class="w-full px-5 py-4 bg-black border border-zinc-700 rounded-xl focus:ring-2 focus:ring-yellow-500"></textarea>
            </div>
          </template>

          <template x-if="q === 1">
            <div>
              <p class="mb-3 text-lg text-zinc-300">2. Where are your properties, clients, or projects primarily located?</p>
              <textarea x-model="answers.q2" required rows="3"
                        class="w-full px-5 py-4 bg-black border border-zinc-700 rounded-xl focus:ring-2 focus:ring-yellow-500"></textarea>
            </div>
          </template>

          <template x-if="q === 2">
            <div>
              <p class="mb-3 text-lg text-zinc-300">3. Who is your ideal audience or clientele?</p>
              <textarea x-model="answers.q3" required rows="3"
                        class="w-full px-5 py-4 bg-black border border-zinc-700 rounded-xl focus:ring-2 focus:ring-yellow-500"></textarea>
            </div>
          </template>

          <template x-if="q === 3">
            <div>
              <p class="mb-3 text-lg text-zinc-300">4. What media, PR, or marketing strategies have you previously invested in (or are currently utilizing)?</p>
              <textarea x-model="answers.q4" required rows="3"
                        class="w-full px-5 py-4 bg-black border border-zinc-700 rounded-xl focus:ring-2 focus:ring-yellow-500"></textarea>
            </div>
          </template>

          <template x-if="q === 4">
            <div>
              <p class="mb-3 text-lg text-zinc-300">5. Which of those strategies have been most effective? Which have not?</p>
              <textarea x-model="answers.q5" required rows="3"
                        class="w-full px-5 py-4 bg-black border border-zinc-700 rounded-xl focus:ring-2 focus:ring-yellow-500"></textarea>
            </div>
          </template>

          <template x-if="q === 5">
            <div>
              <p class="mb-3 text-lg text-zinc-300">6. What is your single most important growth priority over the next 12 months?</p>
              <textarea x-model="answers.q6" required rows="3"
                        class="w-full px-5 py-4 bg-black border border-zinc-700 rounded-xl focus:ring-2 focus:ring-yellow-500"></textarea>
            </div>
          </template>

          <template x-if="q === 6">
            <div>
              <p class="mb-3 text-lg text-zinc-300">7. Where do you want your brand positioned within the market?</p>
              <textarea x-model="answers.q7" required rows="3"
                        class="w-full px-5 py-4 bg-black border border-zinc-700 rounded-xl focus:ring-2 focus:ring-yellow-500"></textarea>
            </div>
          </template>

          <template x-if="q === 7">
            <div>
              <p class="mb-3 text-lg text-zinc-300">8. What is your current monthly or annual allocation for media & marketing?</p>
              <input x-model="answers.q8" type="text" required
                     class="w-full px-5 py-4 bg-black border border-zinc-700 rounded-xl focus:ring-2 focus:ring-yellow-500" />
            </div>
          </template>

          <template x-if="q === 8">
            <div>
              <p class="mb-3 text-lg text-zinc-300">9. Are you prepared to invest in a retainer-based partnership to accelerate growth?</p>
              <select x-model="answers.q9" required
                      class="w-full px-5 py-4 bg-black border border-zinc-700 rounded-xl focus:ring-2 focus:ring-yellow-500">
                <option value="">Select</option>
                <option>Yes, I am ready to invest</option>
                <option>Not at this time</option>
              </select>
            </div>
          </template>

          <template x-if="q === 9">
            <div>
              <p class="mb-3 text-lg text-zinc-300">10. Why do you believe your brand is an ideal fit for an accelerator partnership with Markel Media?</p>
              <textarea x-model="answers.q10" required rows="4"
                        class="w-full px-5 py-4 bg-black border border-zinc-700 rounded-xl focus:ring-2 focus:ring-yellow-500"></textarea>
            </div>
          </template>

          <template x-if="q === 10">
            <div>
              <p class="mb-3 text-lg text-zinc-300">11. If selected, how soon would you be ready to begin this partnership?</p>
              <input x-model="answers.q11" type="text" required
                     class="w-full px-5 py-4 bg-black border border-zinc-700 rounded-xl focus:ring-2 focus:ring-yellow-500" />
            </div>
          </template>
        </div>

        <!-- Navigation Buttons -->
        <div class="flex justify-between">
          <button type="button" @click="if(q>0) q--"
                  class="px-6 py-3 bg-zinc-800 rounded-xl text-zinc-300 hover:text-yellow-400 transition"
                  x-show="q > 0">
            Back
          </button>

          <button type="button" @click="if(q<10) q++" 
                  class="ml-auto px-6 py-3 bg-yellow-600 hover:bg-yellow-500 text-black font-semibold rounded-xl transition"
                  x-show="q < 10">
            Next
          </button>

          <button type="submit"
                  class="ml-auto px-6 py-3 bg-gradient-to-r from-yellow-600 to-yellow-500 text-black font-bold rounded-xl shadow-lg hover:from-yellow-500 hover:to-yellow-400 transition"
                  x-show="q === 10">
            Submit Request
          </button>
        </div>
      </form>
    </template>

    <!-- Confirmation -->
    <template x-if="submitted">
      <div class="text-center space-y-6 animate-fadeIn">
        <h2 class="text-3xl font-serif text-yellow-500">Request Received</h2>
        <p class="text-zinc-300">Thank you for your submission. Each request is personally reviewed by our Partners’ Circle. Only a limited number of collaborations are accepted each quarter. You will be contacted privately within 24–48 hours.</p>
        <span class="inline-block mt-6 px-6 py-3 bg-yellow-600 text-black font-semibold rounded-full">Exclusive Status: Pending Review</span>
      </div>
    </template>
  </div>

  <style>
    .animate-fadeIn { animation: fadeIn 0.8s ease-in-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

</body>
</html>
